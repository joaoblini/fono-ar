    body { overflow: hidden; margin: 0; }

    #canvas-wrap {
      position: fixed;
      top: 60px; left: 0; right: 0; bottom: 0;
    }
    #canvas-wrap canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* sidebar */

      position: fixed; top: 70px; left: 1rem; z-index: 200;
      display: flex; flex-direction: column; gap: 0.3rem;
      max-height: calc(100vh - 90px); overflow-y: auto; width: 224px;
    }
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-thumb { background: rgba(74,158,222,.3); border-radius: 2px; }

    .chip {
      display: flex; align-items: center; gap: .5rem;
      padding: .45rem .75rem;
      background: rgba(13,27,42,.92);
      border: 1px solid rgba(74,158,222,.18); border-radius: 8px;
      cursor: pointer; font-size: .78rem; color: var(--cor-texto);
      transition: all .18s; text-align: left; font-family: inherit; width: 100%;

    .chip.isolado { border-color: var(--cor-acento); background: rgba(232,168,124,.14); color: var(--cor-acento); }
    .chip.oculto  { opacity: .32; }
    .chip-cor  { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .chip-nome { flex: 1; line-height: 1.2; }

    /* controles */
    #ctrl {
      position: fixed; top: 70px; right: 1rem; z-index: 200;
      display: flex; flex-direction: column; gap: .5rem;
    }
    #btn-fs { font-size: 1rem; padding: .5rem .7rem; }

    #painel {
      position: fixed; bottom: 1.5rem; left: 50%;

      width: calc(100% - 3rem); max-width: 430px; z-index: 300;
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
      background: rgba(17,34,51,.97);
      border: 1px solid rgba(232,168,124,.35); border-radius: 14px;
      padding: 1.25rem; box-shadow: 0 8px 32px rgba(0,0,0,.5);

    #painel.show { transform: translateX(-50%) translateY(0); }
    .ph  { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: .55rem; }
    #pnome  { font-size: 1rem; font-weight: 700; color: var(--cor-acento); }
    #pclose { background: none; border: none; color: var(--cor-texto-suave); cursor: pointer; font-size: 1.1rem; padding: 0; }
    #pdesc  { font-size: .83rem; line-height: 1.6; color: var(--cor-texto-suave); margin-bottom: .75rem; }
    .ptags  { display: flex; gap: .4rem; flex-wrap: wrap; }
    .ptag   { font-size: .72rem; padding: .18rem .55rem; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 20px; color: var(--cor-texto-suave); }

    /* banner isolamento */
    #banner {
      position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
      z-index: 300; display: none; align-items: center; gap: .75rem;
      background: rgba(17,34,51,.96); border: 1px solid rgba(232,168,124,.4);

    #btn-deiso {

      border-radius: 20px; color: var(--cor-acento); cursor: pointer;
      font-size: .75rem; padding: .2rem .65rem; font-family: inherit;

    #btn-deiso:hover { background: rgba(232,168,124,.28); }

    /* loading */
    #loading {
      position: fixed; inset: 0; z-index: 900; background: #0d1b2a;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
      transition: opacity .4s;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    .spin  { width: 48px; height: 48px; border: 3px solid rgba(74,158,222,.2); border-top-color: #4a9ede; border-radius: 50%; animation: sp .9s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }

    #lprog { font-size: .78rem; color: rgba(139,175,201,.55); min-height: 1.2em; }

    body.fs .nav-bar   { display: none; }
    body.fs #canvas-wrap { top: 0; }
    body.fs #sidebar   { top: 1rem; }
    body.fs #ctrl      { top: 1rem; }
    body.fs #banner    { top: 1rem; }

    @media (max-width: 640px) { #sidebar { display: none; } }

// ── PARSER STL BINÁRIO ────────────────────────────────────────────────────────
function parseSTL(buf) {
  const view = new DataView(buf);
  const n    = view.getUint32(80, true);
  const pos  = new Float32Array(n * 9);
  const nor  = new Float32Array(n * 9);
  let off = 84;
  for (let i = 0; i < n; i++) {
    const nx=view.getFloat32(off,true), ny=view.getFloat32(off+4,true), nz=view.getFloat32(off+8,true);
    off += 12;
    for (let v = 0; v < 3; v++) {
      const b = i*9+v*3;
      pos[b]  =view.getFloat32(off,  true);
      pos[b+1]=view.getFloat32(off+4,true);
      pos[b+2]=view.getFloat32(off+8,true);
      nor[b]=nx; nor[b+1]=ny; nor[b+2]=nz;
      off+=12;
    }
    off += 2;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal',   new THREE.BufferAttribute(nor, 3));
  return geo;
}

// ── BBOX de array de geometrias (coords brutas) ───────────────────────────────
function bboxOfGeos(geos) {
  let lx=Infinity,ly=Infinity,lz=Infinity,hx=-Infinity,hy=-Infinity,hz=-Infinity;
  geos.forEach(geo => {
    const a = geo.attributes.position.array;
    for (let i=0;i<a.length;i+=3) {
      if(a[i]  <lx)lx=a[i];   if(a[i]  >hx)hx=a[i];
      if(a[i+1]<ly)ly=a[i+1]; if(a[i+1]>hy)hy=a[i+1];
      if(a[i+2]<lz)lz=a[i+2]; if(a[i+2]>hz)hz=a[i+2];
    }
  });
  return {lx,ly,lz,hx,hy,hz,
    cx:(lx+hx)/2, cy:(ly+hy)/2, cz:(lz+hz)/2,
    maxDim: Math.max(hx-lx, hy-ly, hz-lz, 0.001)};
}

// ── CENA THREE.JS ─────────────────────────────────────────────────────────────
const wrap     = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = false;
renderer.outputColorSpace = THREE.SRGBColorSpace;
wrap.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x0d1b2a);

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 2000);
camera.position.set(0, 0, 6);

// OrbitControls — orbit esq, pan meio/shift, zoom scroll
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping    = true;
controls.dampingFactor    = 0.08;
controls.rotateSpeed      = 0.7;
controls.panSpeed         = 0.8;
controls.zoomSpeed        = 1.2;
controls.screenSpacePanning = true;   // pan no plano da tela (igual Blender)
controls.minDistance      = 0.05;
controls.maxDistance      = 500;

// Luzes
scene.add(new THREE.AmbientLight(0x445566, 1.6));
const dir1 = new THREE.DirectionalLight(0xcce0ff, 2.2); dir1.position.set(4,6,5);   scene.add(dir1);
const dir2 = new THREE.DirectionalLight(0xffddcc, 0.9); dir2.position.set(-4,2,-3); scene.add(dir2);
const pt   = new THREE.PointLight(0x4a9ede, 0.7, 0);  pt.position.set(0,4,4);     scene.add(pt);

// Grupo que contém todos os meshes
const grupo = new THREE.Group();
scene.add(grupo);

// Resize
function onResize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

// Render loop
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

// ── ESTADO ────────────────────────────────────────────────────────────────────
let modelo    = null;
let meshMap   = {};   // id → [THREE.Mesh]
let geoMap    = {};   // id → [THREE.BufferGeometry]  (coords brutas)
let isoladoId = null;

// Transformação global (toda a cena centrada)
let globalTarget = new THREE.Vector3();
let globalCamPos = new THREE.Vector3();

// ── CARREGAMENTO ──────────────────────────────────────────────────────────────
async function loadFile(comp) {
  return Promise.all(comp.files.map(async file => {
    const buf  = await fetch(file).then(r => r.arrayBuffer());
    const geo  = parseSTL(buf);
    geo.computeVertexNormals();

    const mat  = new THREE.MeshStandardMaterial({
      color:       new THREE.Color(comp.cor),
      opacity:     comp.op,
      transparent: comp.op < 1,
      side:        THREE.DoubleSide,
      roughness:   0.55,
      metalness:   0.08,
    });
    const mesh = new THREE.Mesh(geo, mat);
    grupo.add(mesh);
    meshMap[comp.id].push(mesh);
    geoMap[comp.id].push(geo);
  }));
}

// ── ENQUADRA câmera + target num bbox dado ────────────────────────────────────
function frameTo(bb, instant = false) {
  const target = new THREE.Vector3(bb.cx, bb.cy, bb.cz);
  // distância para ver o objeto inteiro com FOV 45°
  const dist   = bb.maxDim * 1.5;
  const newPos = new THREE.Vector3(bb.cx, bb.cy, bb.cz + dist);

  if (instant) {
    controls.target.copy(target);
    camera.position.copy(newPos);
    controls.update();
  } else {
    // Animação suave de 400ms
    const t0 = performance.now();
    const fromTarget = controls.target.clone();
    const fromPos    = camera.position.clone();
    function animate(t) {
      const p = Math.min((t - t0) / 400, 1);
      const e = p < 0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2; // easeInOut
      controls.target.lerpVectors(fromTarget, target, e);
      camera.position.lerpVectors(fromPos, newPos, e);
      controls.update();
      if (p < 1) requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  }
}

// ── VISIBILIDADE / ISOLAMENTO ─────────────────────────────────────────────────
function setAllVisible(v) {
  modelo.comps.forEach(c => meshMap[c.id].forEach(m => { m.visible = v; }));
}

function isolate(id) {
  if (isoladoId === id) { deIsolate(); return; }
  isoladoId = id;

  modelo.comps.forEach(c => {
    const vis = c.id === id;
    meshMap[c.id].forEach(m => { m.visible = vis; });
    document.querySelector(`.chip[data-id="${c.id}"]`)?.classList.toggle('oculto',  !vis);
    document.querySelector(`.chip[data-id="${c.id}"]`)?.classList.toggle('isolado',  vis);
  });

  // Enquadra câmera no bbox bruto deste componente
  const bb = bboxOfGeos(geoMap[id]);
  frameTo(bb);

  document.getElementById('banner-nome').textContent = modelo.comps.find(c=>c.id===id)?.nome ?? '';
  document.getElementById('banner').classList.add('show');
  showPainel(id);
}

function deIsolate() {
  isoladoId = null;
  setAllVisible(true);
  modelo.comps.forEach(c =>
    document.querySelector(`.chip[data-id="${c.id}"]`)?.classList.remove('oculto','isolado')
  );
  // Volta ao enquadramento global
  frameTo(bboxOfGeos(modelo.comps.flatMap(c => geoMap[c.id])));
  document.getElementById('banner').classList.remove('show');
  closePainel();
}

// ── PAINEL INFO ───────────────────────────────────────────────────────────────
function showPainel(id) {
  const c = modelo.comps.find(x => x.id === id);
  if (!c) return;
  document.getElementById('pnome').textContent = c.nome;
  document.getElementById('pdesc').textContent = c.desc;
  document.getElementById('ptags').innerHTML =
    `<span class="ptag">🖨 ${c.pecas} peça${c.pecas>1?'s':''}</span>` +
    `<span class="ptag">📄 ${c.files.length} STL</span>` +
    `<span class="ptag" style="color:${c.cor}">● ${c.nome}</span>`;
  document.getElementById('painel').classList.add('show');
}
function closePainel() { document.getElementById('painel').classList.remove('show'); }

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
function buildSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  modelo.comps.forEach(c => {
    const btn = document.createElement('button');
    btn.className  = 'chip';
    btn.dataset.id = c.id;
    btn.innerHTML  = `<span class="chip-cor" style="background:${c.cor}"></span><span class="chip-nome">${c.nome}</span>`;
    btn.addEventListener('click', () => isolate(c.id));
    sb.appendChild(btn);
  });
}

// ── FULLSCREEN ────────────────────────────────────────────────────────────────
function setupFS() {
  const btn = document.getElementById('btn-fs');
  btn.addEventListener('click', () => {
    const fs = document.body.classList.toggle('fs');
    btn.textContent = fs ? '✕' : '⛶';
    setTimeout(onResize, 50);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (document.body.classList.contains('fs')) {
        document.body.classList.remove('fs');
        document.getElementById('btn-fs').textContent = '⛶';
        setTimeout(onResize, 50);
      } else if (isoladoId) {
        deIsolate();
      }
    }
  });
}

// ── BOTÕES ────────────────────────────────────────────────────────────────────
function setupBtns() {
  document.getElementById('btn-reset').addEventListener('click', () => {
    if (isoladoId) {
      frameTo(bboxOfGeos(geoMap[isoladoId]));
    } else {
      frameTo(bboxOfGeos(modelo.comps.flatMap(c => geoMap[c.id])));
    }
  });
  document.getElementById('btn-all').addEventListener('click', deIsolate);
  document.getElementById('btn-deiso').addEventListener('click', deIsolate);
  document.getElementById('pclose').addEventListener('click', closePainel);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const param  = params.get('modelo') ?? 'celula';
modelo = MODELOS[param] ?? MODELOS.celula;
document.title = modelo.titulo + ' 3D · LabSD · Saúde Digital';
modelo.comps.forEach(c => { meshMap[c.id] = []; geoMap[c.id] = []; });

buildSidebar();
setupFS();
setupBtns();

const progEl   = document.getElementById('lprog');
const allFiles = modelo.comps.reduce((s,c) => s + c.files.length, 0);
let   loaded   = 0;

try {
  await Promise.all(modelo.comps.map(comp =>
    loadFile(comp).then(() => {
      loaded += comp.files.length;
      progEl.textContent = `${loaded} / ${allFiles} arquivos`;
    })
  ));
} catch(err) {
  document.getElementById('lbl').textContent = '⚠ Erro ao carregar: ' + err.message;
  document.getElementById('lprog').textContent = err.stack ?? '';
  console.error(err);
  throw err;
}

// Enquadra toda a cena — sempre inicia com tudo visível
const allGeos = modelo.comps.flatMap(c => geoMap[c.id]);
frameTo(bboxOfGeos(allGeos), true);

document.getElementById('loading').classList.add('hide');
setTimeout(() => document.getElementById('loading')?.remove(), 450);
</script>
</body>
</html>
